name: Release Native Libs

# 按需安装的组件包（torrent / asr / ocr / translate / ijk / ali / mpv / ffmpeg 的 so），
# 与 APK 同 tag 发布为 release 资产，由 app 侧 NativeLibManager 运行时下载。
# 详见 palyerlibrary/.../tool/NativeLibManager.java 与 tools/build_native_libs.py。
#
# 为什么 CI 不构建 zip：zip 的 deflate 字节流依赖运行时的 zlib 版本，不同环境
# （本机 Python 3.13 / runner 的 Python 3.12）产出体积相同但 sha256 不同的包，
# 而 sha256 是 app 下载后做完整性校验的硬编码常量。故 zip 一律在本地构建、
# gh release upload 上传，本 workflow 只校验已上传资产与常量一致。
# 本地构建与上传：
#   python tools/build_native_libs.py
#   python tools/build_native_libs.py --verify palyerlibrary/.../NativeLibManager.java
#   gh release upload vX.Y.Z build/native-libs/*.zip --clobber

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-native-libs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify RELEASE_TAG matches the pushed tag
        # 组件 URL 是硬编码 tag 的（NativeLibManager.RELEASE_TAG），若与本次 tag
        # 不一致，app 会去一个不存在的地址下载。这里提前失败，避免发出坏包。
        if: github.ref_type == 'tag'
        run: |
          set -e
          JAVA=palyerlibrary/src/main/java/com/orange/playerlibrary/tool/NativeLibManager.java
          JAVA_TAG=$(grep -oP 'RELEASE_TAG\s*=\s*"\K[^"]+' "$JAVA")
          echo "Java RELEASE_TAG=$JAVA_TAG, pushed tag=${GITHUB_REF_NAME}"
          if [ "$JAVA_TAG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::NativeLibManager.RELEASE_TAG ($JAVA_TAG) != tag (${GITHUB_REF_NAME})；请先更新常量再打 tag"
            exit 1
          fi

      - name: Verify release assets match NativeLibManager constants
        # 资产 sha256/size 是硬编码常量，不一致则用户下载后哈希校验必然失败。
        # 资产由本地构建后上传（见文件头说明）。
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_native_libs.py --check-release "${GITHUB_REF_NAME}"

      - name: List release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[] | "\(.name)  \(.size)"'
