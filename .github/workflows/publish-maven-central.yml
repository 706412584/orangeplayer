name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.3.3)'
        required: false
        type: string
      close_only:
        description: 'Only close the staging repository (manual release later)'
        required: false
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle.properties 不再入库；本机 JDK 路径行在 CI 无害但保持环境干净
      - name: Strip local Windows JDK path (if present)
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties || true

      - name: Decode GPG key
        env:
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: |
          if [ -z "$GPG_SECRET_KEY" ]; then
            echo "Missing secret GPG_SECRET_KEY (base64-encoded secring.gpg)"
            exit 1
          fi
          printf '%s' "$GPG_SECRET_KEY" | base64 --decode > "$HOME/secring.gpg"
          test -s "$HOME/secring.gpg"

      # 凭据经 ORG_GRADLE_PROJECT_* 环境变量注入（Gradle findProperty 自动拾取）
      - name: Publish to Sonatype staging
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.secretKeyRingFile: ${{ format('{0}/secring.gpg', env.HOME) }}
        run: ./gradlew publishToSonatype

      # 两段式：close 完成 staging 校验；release 默认手动执行（Maven Central 发布不可撤）
      - name: Close staging repository
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew closeSonatypeStagingRepository

      - name: Release staging repository (manual opt-in)
        if: ${{ inputs.close_only == false }}
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew releaseSonatypeStagingRepository

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/secring.gpg"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: palyerlibrary/build/outputs/aar/*.aar
