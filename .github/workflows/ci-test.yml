name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Strip local Windows JDK path (if present)
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties || true

      - name: Run unit tests
        run: |
          ./gradlew :palyerlibrary:testDebugUnitTest \
                    :app:testDebugUnitTest \
                    :app-legacy:testDebugUnitTest \
                    :orange-downloader:testDebugUnitTest

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            palyerlibrary/build/reports/tests/
            app/build/reports/tests/
            app-legacy/build/reports/tests/
