name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Strip local Windows JDK path (if present)
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties || true

      - name: mpv integration architecture check
        run: bash scripts/check_mpv_isolation.sh

      - name: Run unit tests
        run: |
          # app-legacy 的 6 个测试与 app 完全重复（Robolectric 组件测试），
          # 且其 unit-test manifest 合并受 DLNA 库 minSdk 24 冲突影响，暂不纳入 CI
          # app 测试编译依赖链含 :orangeplayer-mpv（app 依赖它），其源码 import
          # dev.jdtech.mpv.MPVLib（Java 21 字节码），需 fork JDK 21 编译——
          # 与 release-apk.yml 的 Build 步骤同理，从 runner 预装路径注入。
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            export ORANGE_MPV_JDK21="$JAVA_HOME_21_X64"
            echo "Using JDK21 for orangeplayer-mpv: $ORANGE_MPV_JDK21"
          fi
          ./gradlew :palyerlibrary:testDebugUnitTest \
                    :app:testDebugUnitTest \
                    :orange-downloader:testDebugUnitTest

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            palyerlibrary/build/reports/tests/
            app/build/reports/tests/
