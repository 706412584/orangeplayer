name: Release APK

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
        # slim = so 按需下载（默认）；full = so 打进 APK（宿主装完即用）
        variant: [slim, full]

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK
        # AGP 的 stripReleaseDebugSymbols 在缺 NDK 时**静默跳过**（不报错），
        # 结果 so 带调试符号进 APK——v1.5.2 的 arm64 包因此有 140MB（本地 125MB）。
        # 版本与 AGP 8.12 内置默认值一致，保证与本地产出可复现。
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" >/dev/null
          ls -d "$ANDROID_HOME/ndk/27.0.12077973"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Strip local Windows JDK path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing secret APK_SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 --decode > app/smlieapp.jks
          test -s app/smlieapp.jks
          python3 - <<'PY'
          import os, sys
          data = open("app/smlieapp.jks", "rb").read(4)
          if data != b"\xfe\xed\xfe\xed":
              print("Decoded keystore is not a valid JKS (magic=%r)" % data)
              sys.exit(1)
          print("Keystore decoded, size=%d" % os.path.getsize("app/smlieapp.jks"))
          PY
          STORE_PASS="${APK_KEYSTORE_PASSWORD:-123123}"
          KEY_ALIAS="${APK_KEY_ALIAS:-smlieapp}"
          keytool -list -keystore app/smlieapp.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Prepare libmpv mavenrepo (local resolution for CI)
        # libmpv-central 发布的 Central 坐标 io.github.706412584:libmpv 在 Central 上
        # 只有 .aar 缺 .jar（AGP android-classes-jar transform 需要 jar 变体），
        # CI 无本地 mavenrepo 会解析失败。此步从 Central 拉取 AAR 并解出 classes.jar，
        # 生成带 jar 的 mavenrepo 供构建使用（不依赖 git 内的 AAR，AAR 47MB 不入库）。
        run: |
          set -e
          LMPV_DIR=orangeplayer-mpv/mavenrepo/io/github/706412584/libmpv/1.0.0
          mkdir -p "$LMPV_DIR"
          # 从 Central 拉取 aar（无法用 gradle 缓存时直接从官方仓库下载）
          curl -sfL -o "$LMPV_DIR/libmpv-1.0.0.aar" \
            https://repo1.maven.org/maven2/io/github/706412584/libmpv/1.0.0/libmpv-1.0.0.aar
          # 解出 AAR 内 classes.jar 作为独立 jar（AGP transform 需要 jar 变体）
          cd "$LMPV_DIR"
          unzip -o -j libmpv-1.0.0.aar classes.jar >/dev/null
          mv classes.jar libmpv-1.0.0.jar
          # pom 与 checksum（Gradle 本地仓库解析需要 pom；checksum 可选但本地仓库通常要求）
          curl -sfL -o libmpv-1.0.0.pom \
            https://repo1.maven.org/maven2/io/github/706412584/libmpv/1.0.0/libmpv-1.0.0.pom
          cd -

      - name: Fetch sherpa-onnx AAR
        # 49MB AAR 受 .gitignore 的 *.aar 规则排除（与 libmpv 同理不入库），
        # :orangeplayer-sherpa 经 settings.gradle 的 flatDir 仓库解析它。
        run: |
          set -e
          DEST=orangeplayer-sherpa/libs/sherpa-onnx-1.13.7.aar
          mkdir -p "$(dirname "$DEST")"
          curl -sfL --retry 3 --retry-delay 5 -o "$DEST" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          echo "c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8  $DEST" | sha256sum -c -

      - name: Build Release APK (${{ matrix.abi }} / ${{ matrix.variant }})
        env:
          ORG_GRADLE_PROJECT_orangeAppReleaseAbis: ${{ matrix.abi }}
          ORG_GRADLE_PROJECT_orangeFullNativeLibs: ${{ matrix.variant == 'full' }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          STORE_PASS="${APK_KEYSTORE_PASSWORD:-123123}"
          KEY_ALIAS="${APK_KEY_ALIAS:-smlieapp}"
          KEY_PASS="${APK_KEY_PASSWORD:-123123}"
          # libmpv AAR 的 classes.jar 为 Java 21 字节码（v65），orangeplayer-mpv
          # 编译需 fork JDK 21。runner 预装 JDK 21 路径在 shell 环境变量
          # JAVA_HOME_21_X64（不是 Actions env 上下文），显式导出给 Gradle。
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            export ORANGE_MPV_JDK21="$JAVA_HOME_21_X64"
            echo "Using JDK21: $ORANGE_MPV_JDK21"
          else
            echo "WARN: JAVA_HOME_21_X64 not set, orangeplayer-mpv may fail to compile"
          fi
          ./gradlew :app:assembleRelease \
            -PorangeFfmpegAbis="${{ matrix.abi }}" \
            -PappStorePassword="$STORE_PASS" \
            -PappKeyAlias="$KEY_ALIAS" \
            -PappKeyPassword="$KEY_PASS"

      - name: Rename APK
        run: |
          APK_DIR=app/build/outputs/apk/release
          ls -lh "$APK_DIR"
          VERSION="${GITHUB_REF_NAME}"
          mv "$APK_DIR/app-release.apk" \
             "OrangePlayer-${VERSION}-${{ matrix.variant }}-${{ matrix.abi }}.apk"

      - name: Verify APK size sanity
        # 守护两件事，防止静默降级：
        #  1. slim 不该带「按需下载」的可选 so（slim 本来就有 3 个无关 so：androidx
        #     图形库 / ffmpegJNI / rtmp，所以按名字判而非按数量判）
        #  2. full 里的 so 必须 strip 过——CI 缺 NDK 时 AGP 静默跳过 strip，
        #     libijkffmpeg 会从 5.9MB 变 25MB（各 ABI 阈值见脚本内）
        run: |
          APK="OrangePlayer-${GITHUB_REF_NAME}-${{ matrix.variant }}-${{ matrix.abi }}.apk"
          SIZE=$(stat -c%s "$APK")
          echo "$APK = $((SIZE/1048576)) MiB"
          python3 - "$APK" "${{ matrix.variant }}" "${{ matrix.abi }}" <<'PY'
          import sys, zipfile

          apk, variant, abi = sys.argv[1], sys.argv[2], sys.argv[3]
          # 按需下载的可选 so：slim 里出现任一即为剔除失效
          OPTIONAL = {
              'libalivcffmpeg.so', 'libavcodec.so', 'libavdevice.so', 'libavfilter.so',
              'libavformat.so', 'libavutil.so', 'libc++_shared.so', 'libijkffmpeg.so',
              'libijkplayer.so', 'libijksdl.so', 'libjpeg.so', 'libleptonica.so',
              'libmpv.so', 'libonnxruntime.so', 'liborangeffmpegkit.so', 'libplayer.so',
              'libpngx.so', 'libsaasCorePlayer.so', 'libsaasDownloader.so',
              'libswresample.so', 'libswscale.so', 'libtesseract.so', 'libtorrent4j.so',
              'libtranslate_jni.so',
          }
          # libijkffmpeg.so 各 ABI 的 strip 上限（实测 strip 后 4.8~8.6MB，
          # 未 strip 是 20~28MB；取略高于 strip 值、远低于未 strip 值）
          IJK_LIMIT = {
              'arm64-v8a': 8 * 1024 * 1024,
              'armeabi-v7a': 7 * 1024 * 1024,
              'x86_64': 11 * 1024 * 1024,
              'x86': 9 * 1024 * 1024,
          }
          z = zipfile.ZipFile(apk)
          libs = {n.rsplit('/', 1)[-1]: z.getinfo(n).file_size
                  for n in z.namelist() if n.startswith('lib/')}
          if variant == 'slim':
              leaked = sorted(set(libs) & OPTIONAL)
              if leaked:
                  print('FAIL: slim 版不该带可选 so，却出现 %s' % leaked)
                  sys.exit(1)
              print('OK: slim 无泄漏，保留 %d 个必需 so' % len(libs))
          else:
              ijk = libs.get('libijkffmpeg.so')
              if ijk is None:
                  print('FAIL: full 版缺少 libijkffmpeg.so')
                  sys.exit(1)
              limit = IJK_LIMIT.get(abi)
              if limit is None:
                  print('FAIL: 未知 ABI %s，无法校验 strip' % abi)
                  sys.exit(1)
              if ijk > limit:
                  print('FAIL: libijkffmpeg.so 未 strip（%d B > 上限 %d B）' % (ijk, limit))
                  sys.exit(1)
              print('OK: full 共 %d 个 so，ijk=%d B（上限 %d）' % (len(libs), ijk, limit))
          PY

      - name: Upload APK to artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}-${{ matrix.abi }}
          path: OrangePlayer-*.apk

  release:
    if: github.ref_type == 'tag'
    needs: build-apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: apk-*
          merge-multiple: true

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OrangePlayer ${{ github.ref_name }}
          generate_release_notes: true
          files: apks/OrangePlayer-*.apk
