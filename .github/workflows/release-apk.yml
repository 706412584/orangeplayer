name: Release APK

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Strip local Windows JDK path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing secret APK_SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > app/smlieapp.jks
          test -s app/smlieapp.jks

      - name: Build Release APK (${{ matrix.abi }})
        env:
          ORG_GRADLE_PROJECT_orangeAppReleaseAbis: ${{ matrix.abi }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappStorePassword="$APK_KEYSTORE_PASSWORD" \
            -PappKeyAlias="$APK_KEY_ALIAS" \
            -PappKeyPassword="$APK_KEY_PASSWORD"

      - name: Rename APK
        run: |
          APK_DIR=app/build/outputs/apk/release
          ls -lh "$APK_DIR"
          VERSION="${GITHUB_REF_NAME}"
          mv "$APK_DIR/app-release.apk" \
             "OrangePlayer-${VERSION}-${{ matrix.abi }}.apk"

      - name: Upload APK to artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: OrangePlayer-*.apk

  release:
    if: github.ref_type == 'tag'
    needs: build-apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: apk-*
          merge-multiple: true

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OrangePlayer ${{ github.ref_name }}
          generate_release_notes: true
          files: apks/OrangePlayer-*.apk
