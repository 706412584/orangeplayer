name: Gitee Connectivity Probe

# 一次性诊断：从 GitHub Actions runner 探测 Gitee 的网络可达性与上传接口。
# 背景：sync-to-gitee 的 attach_files 上传在 9MB 与 120MB 两种体积下都
# 「0 bytes received」超时，需要区分是网络层不可达还是接口拒绝。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS / 连通性
        run: |
          echo "=== DNS ==="
          getent hosts gitee.com || echo "DNS 解析失败"
          echo
          echo "=== ping ==="
          ping -c 3 -W 3 gitee.com || echo "ping 不通（可能被 ICMP 屏蔽，不代表 HTTP 不通）"
          echo
          echo "=== TCP 443 ==="
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/gitee.com/443' && echo "443 可连" || echo "443 不可连"

      - name: 简单 GET
        run: |
          echo "=== GET 仓库信息 ==="
          curl -sS -o /tmp/a.json -w 'HTTP=%{http_code} time=%{time_total}s size=%{size_download}\n' \
            --max-time 30 "https://gitee.com/api/v5/repos/wu-yongchengsvip/orangeplayer" || echo "GET 失败"
          head -c 200 /tmp/a.json 2>/dev/null; echo

      - name: 小文件 multipart 上传测试
        env:
          GITEE_KEY: ${{ secrets.GITEE_KEY }}
        run: |
          set -x
          # 造一个 1MB 的小文件
          head -c 1048576 /dev/urandom > /tmp/tiny.bin
          ls -la /tmp/tiny.bin

          # 先拿到 v1.5.4 的 release id
          curl -sS -o /tmp/r.json --max-time 30 \
            "https://gitee.com/api/v5/repos/wu-yongchengsvip/orangeplayer/releases/tags/v1.5.4?access_token=${GITEE_KEY}"
          RID=$(jq -r 'if . == null then "" else (.id|tostring) end' /tmp/r.json)
          echo "RID=$RID"

          # 详细模式，看卡在哪一步
          curl -v -o /tmp/up.json -w '\nHTTP=%{http_code} time=%{time_total}s sent=%{size_upload}\n' \
            --max-time 90 -X POST \
            "https://gitee.com/api/v5/repos/wu-yongchengsvip/orangeplayer/releases/${RID}/attach_files" \
            -F "access_token=${GITEE_KEY}" \
            -F "file=@/tmp/tiny.bin" 2>&1 | tail -40
          echo "--- response body ---"
          head -c 400 /tmp/up.json 2>/dev/null; echo
