// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.12.0' apply false
    id 'com.android.library' version '8.12.0' apply false
    id 'io.github.gradle-nexus.publish-plugin' version '1.3.0'
}

// GSYVideoPlayer 依赖配置（必须在最前面）
apply from: "${rootDir}/gradle/dependencies.gradle"

// ijkplayer 需要的配置
ext {
    compileSdkVersion = 36
    buildToolsVersion = "34.0.0"
    targetSdkVersion = 36
    // 发布脚本被 gitignore 时，模块仍需要这些默认值才能配置
    pomGroupId = 'io.github.706412584'
    pomVersion = '1.3.2'
}

// Maven Central 发布配置（本地文件，CI 上可能不存在）
def mavenPublishScript = file("${rootDir}/maven-publish.gradle")
if (mavenPublishScript.exists()) {
    apply from: mavenPublishScript
}