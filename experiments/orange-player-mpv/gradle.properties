# 构建配置（无凭据，入库）
# 凭据类 key 已移除：本地开发请在同目录创建 gradle-local.properties 之外的方式注入，
# 实际做法：发布时凭据经环境变量 ORG_GRADLE_PROJECT_* 注入（Gradle 自动拾取），
# 或临时在本地 gradle.properties 追加凭据行（该文件在 .gitignore 中，
# 当前已跟踪的这份仅含构建配置，修改时切勿加入任何密码/密钥）。

# Android 配置
android.useAndroidX=true
android.enableJetifier=true

# Gradle 内存配置
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 指定 Gradle 使用的 Java 路径（S2 spike：libmpv AAR 为 Java 21 字节码，需 JDK 21）
org.gradle.java.home=D\:\\android\\openjdk\\jdk-21.0.11+10

# Android SDK 路径
sdk.dir=D\:\\android
