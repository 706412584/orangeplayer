plugins {
    id 'com.android.library'
}

android {
    namespace 'com.orange.player.sherpa'
    compileSdk 36

    defaultConfig {
        minSdk 23          // 与主库一致（sherpa AAR 要求 21+，无抬升需求）
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    // 接口定义在 palyerlibrary（BatchAsrEngine）
    api project(':palyerlibrary')

    // sherpa-onnx（k2-fsa）官方 GitHub Release AAR（无 Maven Central 坐标）。
    // 经 settings.gradle 的 flatDir 仓库解析。49MB 全 4 架构；
    // 打包时随 app 的 orangeAppReleaseAbis 裁到目标 ABI。
    api(name: 'sherpa-onnx-1.13.7', ext: 'aar')

    // compileOnly：只为编译期可见 kotlin.jvm.functions.Function3。
    // 不引入新的运行时要求——sherpa AAR 是 Kotlin 写的，其 process(float[])
    // 本身就在调 kotlin/jvm/internal/Intrinsics，kotlin-stdlib 早就必须由宿主提供
    // （app/build.gradle 的 implementation 即此）。故此处只补编译期可见性，
    // 不打包、不传递，与 palyerlibrary 对可选组件的既有约定一致。
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.5.30'

    testImplementation 'junit:junit:4.13.2'
}

// ===== Maven Central 发布（随主仓 pomVersion；与 orangeplayer-mpv 同模式） =====
def mavenPublishScript = file("${rootProject.projectDir}/maven-publish.gradle")
if (mavenPublishScript.exists()) {
    apply from: mavenPublishScript
}
